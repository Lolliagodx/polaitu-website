name: Install supplied AI showreel
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-ai-showreel.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified video and update site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          api_root = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/'
          def api(path):
              req = urllib.request.Request(api_root + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.load(response)
          head = api('git/ref/heads/main')['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Main changed; refusing to overwrite newer work'
          video = bytearray()
          for sha in ["1a1289583ceae3c1f2baf72a5f8631ce958a3dcd","0ecd6d34c1d388ec0269450b91c7c0655ddfe490","b86c74231169235bf69281991c6e8a11ec9ebff5","0408c3b3a9e695ad34cf2253c8cce8881206fd57"]:
              video.extend(base64.b64decode(api('git/blobs/' + sha)['content']))
          expected = '339897e08986398ad3530c76745f3e0a99732c6a'
          assert hashlib.sha1(b'blob ' + str(len(video)).encode() + b'\0' + video).hexdigest() == expected
          path = pathlib.Path('assets/ai/videos/showreel.mp4')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(video)
          entries = [{"path":"ai.html","mode":"100644","type":"blob","sha":"1ff6a00c51d5bde5da3b0c1498484b133d50c1b6"},{"path":"css/ai.css","mode":"100644","type":"blob","sha":"fe5f13fbba37e8f686e35a183919a87252315ecf"}]
          for entry in entries:
              data = base64.b64decode(api('git/blobs/' + entry['sha'])['content'])
              pathlib.Path(entry['path']).write_bytes(data)
          def git(*args):
              return subprocess.check_call(['git', *args])
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', 'assets/ai/videos/showreel.mp4', 'ai.html', 'css/ai.css')
          git('commit', '-m', 'Install original-quality AI showreel and Figma comparison updates')
          git('push', 'origin', 'HEAD:main')
          print(json.dumps({'video_sha': expected, 'bytes': len(video)}))
