name: Install supplied AI showreel
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-ai-showreel.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assemble verified video and update site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request
          api_root = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/'
          def api(path, method='GET', data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(api_root + path, data=body, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.load(response)
          video = bytearray()
          for sha in ["1a1289583ceae3c1f2baf72a5f8631ce958a3dcd","0ecd6d34c1d388ec0269450b91c7c0655ddfe490","b86c74231169235bf69281991c6e8a11ec9ebff5","0408c3b3a9e695ad34cf2253c8cce8881206fd57"]:
              chunk = api('git/blobs/' + sha)
              video.extend(base64.b64decode(chunk['content']))
          expected = '339897e08986398ad3530c76745f3e0a99732c6a'
          actual = hashlib.sha1(b'blob ' + str(len(video)).encode() + b'\0' + video).hexdigest()
          assert actual == expected, 'Assembled video checksum mismatch'
          blob = api('git/blobs', 'POST', {'content': base64.b64encode(video).decode(), 'encoding': 'base64'})
          assert blob['sha'] == expected
          head = api('git/ref/heads/main')['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Main changed; refusing to overwrite newer work'
          base = api('git/commits/' + head)['tree']['sha']
          entries = [{"path":"ai.html","mode":"100644","type":"blob","sha":"1ff6a00c51d5bde5da3b0c1498484b133d50c1b6"},{"path":"css/ai.css","mode":"100644","type":"blob","sha":"fe5f13fbba37e8f686e35a183919a87252315ecf"}]
          entries.append({'path': 'assets/ai/videos/showreel.mp4', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/install-ai-showreel.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('git/trees', 'POST', {'base_tree': base, 'tree': entries})
          commit = api('git/commits', 'POST', {'message': 'Install supplied AI showreel and align AI comparisons with Figma', 'tree': tree['sha'], 'parents': [head]})
          api('git/refs/heads/main', 'PATCH', {'sha': commit['sha'], 'force': False})
          print(json.dumps({'commit': commit['sha'], 'tree': tree['sha'], 'video_sha': blob['sha']}))
